<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakai bathy — throwaway M1 viewer</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b1622; color: #cfe3f2;
         font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  header { padding: 10px 14px; background: #10202f; border-bottom: 1px solid #1d3346;
           display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { color: #8fb3cc; }
  .notice { color: #ffcf6b; font-weight: 600; }
  #wrap { padding: 12px; }
  canvas { background: #06101a; border: 1px solid #1d3346; max-width: 100%;
           image-rendering: pixelated; touch-action: none; cursor: crosshair; }
  #legend { display: flex; gap: 10px; align-items: center; margin-top: 10px;
            flex-wrap: wrap; }
  #ramp { width: 220px; height: 12px; border: 1px solid #1d3346; }
  .swatch { display: inline-block; width: 12px; height: 12px; vertical-align: middle;
            margin-right: 4px; border: 1px solid #1d3346; }
  #readout { margin-top: 8px; font-variant-numeric: tabular-nums; color: #bfe0ff;
             min-height: 1.3em; }
  #readout b { color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Hakai Structure Finder — bathy tile viewer</h1>
  <span id="status">loading…</span>
  <span class="notice">NOT FOR NAVIGATION</span>
</header>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="legend">
    <span>shallow</span>
    <canvas id="ramp" width="220" height="12"></canvas>
    <span>deep</span>
    <span style="margin-left:16px"><span class="swatch"
      style="background:repeating-linear-gradient(45deg,#334,#334 2px,#0b1622 2px,#0b1622 4px)"></span>no modern survey</span>
    <span id="range" style="margin-left:16px"></span>
  </div>
  <div id="readout">move the cursor over the chart to read position + depth</div>
</div>
<script type="module">
// Throwaway M1 sanity viewer: loads the tile manifest + gzipped Int16 depth tiles,
// decompresses in-browser (DecompressionStream), and renders a depth-tinted mosaic.
// Hovering reads back lat/lon + depth so we can check specific fishing spots against
// the raw survey. This is NOT the app renderer (that's M2, ported from the prototype).
//
// Serve from the repo root so the relative data path resolves:
//     python3 -m http.server 8000
//     open http://localhost:8000/pipeline/viewer/
const MANIFEST_URL = new URL('../../data/tiles/manifest.json', location.href);
const status = document.getElementById('status');
const readout = document.getElementById('readout');

// --- depth colormap (metres -> rgb) ---------------------------------------
const STOPS = [
  [0,   [198, 236, 255]],
  [10,  [120, 200, 240]],
  [25,  [ 64, 156, 214]],
  [50,  [ 36, 110, 178]],
  [100, [ 24,  74, 140]],
  [200, [ 16,  44,  96]],
  [400, [  8,  22,  56]],
];
function depthColor(m) {
  if (m <= STOPS[0][0]) return STOPS[0][1];
  for (let i = 1; i < STOPS.length; i++) {
    if (m <= STOPS[i][0]) {
      const [d0, c0] = STOPS[i - 1], [d1, c1] = STOPS[i];
      const t = (m - d0) / (d1 - d0);
      return [0, 1, 2].map(k => Math.round(c0[k] + t * (c1[k] - c0[k])));
    }
  }
  return STOPS[STOPS.length - 1][1];
}

// --- inverse UTM (WGS84) -> lon/lat, so the readout shows real coordinates --
// Standard Snyder inverse transverse Mercator. zoneEpsg 326xx -> zone = xx.
function utmToLonLat(E, N, epsg) {
  const zone = epsg - 32600;               // 32609 -> 9 (northern hemisphere)
  const a = 6378137.0, f = 1 / 298.257223563;
  const e2 = f * (2 - f), k0 = 0.9996;
  const lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
  const x = E - 500000, y = N;
  const M = y / k0;
  const mu = M / (a * (1 - e2/4 - 3*e2*e2/64 - 5*e2*e2*e2/256));
  const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const phi1 = mu
    + (3*e1/2 - 27*e1**3/32) * Math.sin(2*mu)
    + (21*e1**2/16 - 55*e1**4/32) * Math.sin(4*mu)
    + (151*e1**3/96) * Math.sin(6*mu)
    + (1097*e1**4/512) * Math.sin(8*mu);
  const ep2 = e2 / (1 - e2);
  const C1 = ep2 * Math.cos(phi1)**2;
  const T1 = Math.tan(phi1)**2;
  const s = Math.sin(phi1);
  const N1 = a / Math.sqrt(1 - e2*s*s);
  const R1 = a * (1 - e2) / Math.pow(1 - e2*s*s, 1.5);
  const D = x / (N1 * k0);
  const lat = phi1 - (N1 * Math.tan(phi1) / R1) * (D*D/2
    - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*ep2) * D**4/24
    + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*ep2 - 3*C1*C1) * D**6/720);
  const lon = lon0 + (D - (1 + 2*T1 + C1) * D**3/6
    + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*ep2 + 24*T1*T1) * D**5/120) / Math.cos(phi1);
  return [lon * 180 / Math.PI, lat * 180 / Math.PI];
}

async function gunzip(buf) {
  const ds = new DecompressionStream('gzip');
  const stream = new Response(buf).body.pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function drawRamp() {
  const rc = document.getElementById('ramp'), rx = rc.getContext('2d');
  for (let x = 0; x < rc.width; x++) {
    const m = (x / rc.width) * 250;
    const [r, g, b] = depthColor(m);
    rx.fillStyle = `rgb(${r},${g},${b})`;
    rx.fillRect(x, 0, 1, rc.height);
  }
}

let MANIFEST, FIT = 1;
const TILES = new Map();   // id -> { depths:Int16Array, w, h, col, row }

async function main() {
  drawRamp();
  try {
    MANIFEST = await (await fetch(MANIFEST_URL)).json();
  } catch (e) {
    status.textContent = 'no manifest — run fetch_bathy.py then make_tiles.py first';
    return;
  }
  const { full, tileSize, tiles, depth } = MANIFEST;
  const NODATA = depth.nodata, SCALE = depth.scale;

  const canvas = document.getElementById('c');
  const maxW = Math.min(1400, window.innerWidth - 24);
  FIT = Math.min(1, maxW / full.width);
  canvas.width = Math.round(full.width * FIT);
  canvas.height = Math.round(full.height * FIT);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const off = document.createElement('canvas');
  const octx = off.getContext('2d');

  let dmin = Infinity, dmax = -Infinity, done = 0;
  for (const t of tiles) {
    try {
      const raw = await gunzip(await (await fetch(new URL(t.bin, MANIFEST_URL)))
        .arrayBuffer());
      const depths = new Int16Array(raw.buffer, raw.byteOffset, raw.byteLength / 2);
      TILES.set(t.id, { depths, w: t.w, h: t.h, col: t.col, row: t.row });
      off.width = t.w; off.height = t.h;
      const img = octx.createImageData(t.w, t.h);
      for (let i = 0; i < depths.length; i++) {
        const dm = depths[i];
        const o = i * 4;
        if (dm === NODATA) {
          const px = i % t.w, py = (i / t.w) | 0;
          const hatch = ((px + py) & 3) === 0;
          img.data[o] = hatch ? 51 : 11;
          img.data[o + 1] = hatch ? 51 : 22;
          img.data[o + 2] = hatch ? 68 : 34;
          img.data[o + 3] = 255;
        } else {
          const m = dm / SCALE;
          if (m < dmin) dmin = m; if (m > dmax) dmax = m;
          const [r, g, b] = depthColor(m);
          img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
        }
      }
      octx.putImageData(img, 0, 0);
      const dx = t.col * tileSize * FIT, dy = t.row * tileSize * FIT;
      ctx.drawImage(off, dx, dy, t.w * FIT, t.h * FIT);
    } catch (e) {
      console.warn('tile failed', t.id, e);
    }
    done++;
    status.textContent = `rendered ${done}/${tiles.length} tiles`;
  }
  status.textContent = `${tiles.length} tiles · ${full.width}×${full.height} @ `
    + `${MANIFEST.res[0]} m · ${MANIFEST.crs}`;
  document.getElementById('range').textContent =
    isFinite(dmin) ? `depth ${dmin.toFixed(1)}–${dmax.toFixed(1)} m` : '';

  canvas.addEventListener('mousemove', ev => hover(ev, canvas));
  canvas.addEventListener('mouseleave', () => {
    readout.textContent = 'move the cursor over the chart to read position + depth';
  });
}

function hover(ev, canvas) {
  const { full, tileSize, res, origin, crs, depth } = MANIFEST;
  const rect = canvas.getBoundingClientRect();
  // account for the canvas being CSS-scaled by max-width on narrow screens
  const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
  const cx = (ev.clientX - rect.left) * sx, cy = (ev.clientY - rect.top) * sy;
  const fx = Math.floor(cx / FIT), fy = Math.floor(cy / FIT);   // full-raster cell
  if (fx < 0 || fy < 0 || fx >= full.width || fy >= full.height) return;

  // UTM easting/northing at the cell centre
  const E = origin[0] + (fx + 0.5) * res[0];
  const N = origin[1] - (fy + 0.5) * res[1];
  const epsg = parseInt(String(crs).split(':')[1], 10);
  const [lon, lat] = utmToLonLat(E, N, epsg);

  // depth from the retained tile array
  const col = Math.floor(fx / tileSize), row = Math.floor(fy / tileSize);
  const t = TILES.get(`${MANIFEST.layer}_${col}_${row}`);
  let dtxt = '<b>no data</b> (land or no modern survey)';
  if (t) {
    const lx = fx - col * tileSize, ly = fy - row * tileSize;
    const dm = t.depths[ly * t.w + lx];
    if (dm !== depth.nodata) dtxt = `<b>${(dm / depth.scale).toFixed(1)} m</b>`;
  }
  readout.innerHTML =
    `${lat.toFixed(5)}, ${lon.toFixed(5)} &nbsp;·&nbsp; depth ${dtxt}`
    + ` &nbsp;·&nbsp; <span style="color:#6f8ba3">UTM ${E.toFixed(0)}, ${N.toFixed(0)}</span>`;
}
main();
</script>
</body>
</html>
